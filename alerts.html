n-512.png"}]}</script><!--/seo--></head><body><main class="wrap"><h1 style="font-size:28px">🔔 هشدارهای قیمت</h1><p>روی «چارت زنده» با ابزار 🔔 کلیک کنید یا اینجا عدد بنویسید. وقتی قیمت به آن برسد اعلان با صدا می‌گیرید. اعلان وقتی کار می‌کند که سایت در یک تب باز یا نصب‌شده باشد.</p>
<div class="card"><div class="bar"><select id="as" aria-label="نماد"></select><input id="ap" inputmode="decimal" placeholder="قیمت هشدار" style="max-width:200px"><button class="buy" id="ab">افزودن هشدار</button><button id="ac">پاک‌کردن رسیده‌ها</button></div><small>اعلان مرورگر را از «تنظیمات» فعال کنید.</small></div>
<div class="card" style="margin-top:12px;overflow-x:auto"><table><thead><tr><th>نماد</th><th>قیمت هشدار</th><th>جهت</th><th>وضعیت</th><th></th></tr></thead><tbody id="tb"></tbody></table></div></main>
<script src="assets/app.js"></script><script>layout('alerts.html');
const ALL=SYMS;$('#as').innerHTML=Object.keys(ALL).map(s=>`<option value="${s}">${ALL[s]}</option>`).join('');
let sg='';function R(){const l=AL.get(),s=l.map(x=>x.id+x.on).join();if(s===sg)return;sg=s;$('#tb').innerHTML=l.slice().reverse().map(x=>`<tr><td>${NM(x.sym)}</td><td class="mono">${fmt(x.price)}</td><td>${x.dir=='up'?'▲ بالاتر':'▼ پایین‌تر'}</td><td>${x.on?'<span class="up">فعال</span>':'رسید ✓'}</td><td><button data-d="${x.id}" style="padding:2px 10px">✕</button></td></tr>`).join('')||'<tr><td colspan=5>هنوز هشداری ثبت نشده.</td></tr>'}
$('#ab').onclick=()=>{if(addAlert($('#as').value,num($('#ap').value)))$('#ap').value=''};
$('#ac').onclick=()=>{AL.set(AL.get().filter(x=>x.on));R()};$('#tb').onclick=e=>{const id=e.target.dataset.d;if(id){AL.set(AL.get().filter(x=>x.id!=id));R()}};
addEventListener('alertchange',R);R()</script></body></html>
